name: Windows ASIO audio prototype

on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Publish Windows x64
        run: dotnet publish native/WebEffecter.Audio/WebEffecter.Audio.csproj -c Release -o native/dist
      - name: Smoke test CLI without audio hardware
        shell: pwsh
        run: |
          native/dist/WebEffecter.Audio.exe --help
          native/dist/WebEffecter.Audio.exe --list
          native/dist/WebEffecter.Audio.exe --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: web-effecter-audio-win-x64
          path: native/dist/WebEffecter.Audio.exe
      - name: Publish one-click audio download
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view audio-latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create audio-latest native/dist/WebEffecter.Audio.exe --title "Web Effecter Audio" --notes "Windows x64 ASIO companion. Download and run once; then use the website."
          } else {
            gh release upload audio-latest native/dist/WebEffecter.Audio.exe --clobber
          }
